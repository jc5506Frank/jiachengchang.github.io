role: PhD Student in Operations Management
bio: |
  I am a PhD student in Operations Management at The University of Hong Kong.
  I feel extremely fortunate to be supervised by Prof. Xiao Lei. Prior to that,
  I obtained my Master of Science degree in Business Analytics from Columbia University
  and my Bachelor's degree in Mathematics and Economics from The Hong Kong University
  of Science and Technology.
  
  My primary research interests focus on revenue management and human-centric operations.
  Specifically, I am interested in studying users' strategic and behavioral responses under dynamic
  firm-user interactions and designing efficient, implementable operational policies to improve
  revenue and other user-centered objectives in modern digital environments.


